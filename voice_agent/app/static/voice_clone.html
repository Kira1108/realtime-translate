<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声音复刻</title>
<style>
  :root {
    --fog: #e4e8ee;
    --panel: #f4f6f9;
    --ink: #172033;
    --muted: #6b778c;
    --rule: #cdd3dc;
    --cobalt: #2e55d0;
    --jade: #0e8a6e;
    --flare: #d9481c;
    --amber: #b7791f;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fog); color: var(--ink); font: 15px/1.6 var(--sans); }
  main { max-width: 980px; margin: 0 auto; padding: 32px 24px 56px; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: .02em; }
  h1 small { font: 500 13px var(--mono); color: var(--muted); letter-spacing: .08em; margin-left: 10px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; }
  .card + .card { margin-top: 16px; }
  .card > h2 { margin: 0 0 14px; font: 600 12px var(--mono); letter-spacing: .1em; color: var(--muted); }

  /* sample source tabs */
  .tabs { display: inline-flex; background: var(--fog); border-radius: 999px; padding: 3px; margin-bottom: 18px; }
  .tabs button { font: 500 14px var(--sans); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 6px 18px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }

  /* reading script */
  .script { border-left: 3px solid var(--cobalt); padding: 2px 0 2px 16px; margin-bottom: 18px; }
  .script textarea { width: 100%; border: 0; background: none; resize: vertical; font: 19px/1.8 var(--sans); color: var(--ink); padding: 0; min-height: 96px; }
  .script textarea:focus { outline: none; }
  .script-tools { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .link { background: none; border: 0; padding: 0; color: var(--cobalt); font: inherit; cursor: pointer; }

  /* the recorder */
  .recorder { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
  .rec-btn { width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--ink); background: var(--panel); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .rec-btn::before { content: ""; width: 26px; height: 26px; border-radius: 50%; background: var(--flare); transition: border-radius .15s, transform .15s; }
  .rec-btn[data-state="recording"]::before { border-radius: 5px; transform: scale(.85); }
  .rec-btn[data-state="paused"]::before { background: var(--amber); }
  .rec-meta { min-width: 0; }
  .clock { font: 600 30px/1 var(--mono); letter-spacing: .02em; display: flex; align-items: baseline; gap: 12px; }
  .clock span { font: 500 13px var(--sans); color: var(--muted); letter-spacing: 0; }
  canvas { display: block; width: 100%; height: 44px; margin-top: 10px; }

  /* signature: sample length against the zones that make a good clone */
  .length { margin-top: 14px; }
  .length-bar { position: relative; height: 10px; border-radius: 5px; overflow: hidden; display: grid; grid-template-columns: 10fr 20fr 30fr; }
  .length-bar i:nth-child(1) { background: #ead9c4; }
  .length-bar i:nth-child(2) { background: #c4e3d9; }
  .length-bar i:nth-child(3) { background: #d6dbe3; }
  .length-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); opacity: .85; border-radius: 5px; transition: width .2s linear; }
  .length-scale { display: grid; grid-template-columns: 10fr 20fr 30fr; font: 11px var(--mono); color: var(--muted); margin-top: 4px; }
  .length-scale span:nth-child(2) { color: var(--jade); }
  .length-note { font-size: 13px; margin-top: 6px; color: var(--muted); min-height: 21px; }
  .length-note[data-tone="good"] { color: var(--jade); }
  .length-note[data-tone="warn"] { color: var(--amber); }

  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .ghost { font: 500 14px var(--sans); color: var(--ink); background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  .ghost:disabled { opacity: .45; cursor: default; }
  audio { height: 36px; max-width: 100%; }

  /* upload */
  .drop { border: 2px dashed var(--rule); border-radius: 10px; padding: 36px 20px; text-align: center; cursor: pointer; color: var(--muted); }
  .drop[data-over="true"] { border-color: var(--cobalt); color: var(--cobalt); background: rgb(46 85 208 / .05); }
  .drop b { color: var(--ink); font-weight: 600; }
  .file-info { font: 13px var(--mono); margin-top: 12px; color: var(--ink); }

  /* voice settings */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.wide { grid-column: 1 / -1; }
  .field > span { font-size: 13px; font-weight: 600; }
  .field small { color: var(--muted); font-size: 12px; font-weight: 400; }
  input[type="text"], select, textarea.plain { font: 15px var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea.plain { resize: vertical; min-height: 64px; }
  .kind { display: flex; gap: 16px; font-size: 14px; }
  .checks { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--ink); }

  .submit { display: flex; align-items: center; gap: 16px; margin-top: 20px; flex-wrap: wrap; }
  .primary { font: 600 16px var(--sans); color: #fff; background: var(--ink); border: 0; border-radius: 999px; padding: 12px 30px; cursor: pointer; }
  .primary:disabled { opacity: .45; cursor: default; }
  .hint { font-size: 13px; color: var(--muted); }

  /* result */
  .result dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
  .result dt { color: var(--muted); }
  .result dd { margin: 0; font-family: var(--mono); word-break: break-all; }
  .badge { display: inline-block; font: 600 12px var(--mono); padding: 1px 8px; border-radius: 4px; background: var(--fog); }
  .badge[data-tone="good"] { background: #c4e3d9; color: var(--jade); }
  .badge[data-tone="busy"] { background: #d3dcf6; color: var(--cobalt); }
  .badge[data-tone="bad"] { background: #f5d5c9; color: var(--flare); }
  .error { color: var(--flare); font-size: 14px; white-space: pre-wrap; }

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .drop:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .rec-btn::before, .length-fill { transition: none; } }
  @media (max-width: 640px) {
    main { padding: 20px 14px 40px; }
    .grid { grid-template-columns: 1fr; }
    .result dl { grid-template-columns: 96px 1fr; }
    .script textarea { font-size: 17px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>声音复刻<small>VOLCENGINE · SEED</small></h1>
    <p>录一段 10–30 秒的清晰人声，或者上传一个音频文件。</p>
  </header>

  <section class="card" aria-labelledby="sample-title">
    <h2 id="sample-title">样本</h2>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-record" aria-selected="true" aria-controls="pane-record">录音</button>
      <button type="button" role="tab" id="tab-upload" aria-selected="false" aria-controls="pane-upload">上传文件</button>
    </div>

    <div id="pane-record" role="tabpanel" aria-labelledby="tab-record">
      <div class="script">
        <textarea id="script" aria-label="朗读稿" spellcheck="false"></textarea>
        <div class="script-tools">
          <button type="button" class="link" id="next-script">换一段</button>
          <span>用平时说话的语气念，可以自己改稿。</span>
        </div>
      </div>

      <div class="recorder">
        <button type="button" class="rec-btn" id="rec" data-state="idle" aria-label="开始录音"></button>
        <div class="rec-meta">
          <div class="clock"><output id="clock">0:00.0</output><span id="rec-label">点红点开始录音</span></div>
          <canvas id="level" aria-hidden="true"></canvas>
        </div>
      </div>

      <div class="length" aria-label="样本时长">
        <div class="length-bar"><i></i><i></i><i></i><div class="length-fill" id="length-fill"></div></div>
        <div class="length-scale"><span>0s · 偏短</span><span>10s · 合适</span><span>30s · 够长了</span></div>
        <div class="length-note" id="length-note"></div>
      </div>

      <div class="row">
        <button type="button" class="ghost" id="finish" disabled>完成</button>
        <button type="button" class="ghost" id="redo" disabled>重录</button>
        <audio id="rec-preview" controls hidden></audio>
      </div>
    </div>

    <div id="pane-upload" role="tabpanel" aria-labelledby="tab-upload" hidden>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择音频文件">
        <b>拖一个音频文件到这里</b>，或者点击选择<br>
        <small>wav · mp3 · ogg · m4a · aac · pcm（24kHz 单声道），不超过 10MB</small>
      </div>
      <input type="file" id="file" accept=".wav,.mp3,.ogg,.m4a,.aac,.pcm,audio/*" hidden>
      <div class="file-info" id="file-info"></div>
      <div class="row"><audio id="file-preview" controls hidden></audio></div>
    </div>
  </section>

  <section class="card" aria-labelledby="voice-title">
    <h2 id="voice-title">音色</h2>
    <div class="grid">
      <div class="field">
        <span>音色类型</span>
        <div class="kind">
          <label class="check"><input type="radio" name="kind" value="speaker_id" checked>预付费（S_ 开头）</label>
          <label class="check"><input type="radio" name="kind" value="custom_speaker_id">后付费（自定义名）</label>
        </div>
      </div>
      <label class="field">
        <span id="id-label">音色 ID <small>控制台「声音复刻」里的 S_ 编号</small></span>
        <input type="text" id="voice-id" placeholder="S_xxxxxxxx" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>样本语种</span>
        <select id="language">
          <option value="cn">中文</option><option value="en">英文</option><option value="ja">日语</option>
          <option value="ko">韩语</option><option value="es">西班牙语</option><option value="fr">法语</option>
          <option value="de">德语</option><option value="pt">葡萄牙语</option><option value="ru">俄语</option>
        </select>
      </label>
      <label class="field">
        <span>试听文本 <small>4–300 字，训练完会用这段话合成试听</small></span>
        <input type="text" id="demo-text" value="你好，这是用我的声音复刻出来的语音，听起来像我吗？">
      </label>
      <div class="field wide">
        <span>参考文本 <small>样本说了什么；和录音差太多会训练失败，不确定就留空</small></span>
        <label class="check" id="use-script-wrap"><input type="checkbox" id="use-script" checked>用朗读稿（照着念了就勾上）</label>
        <textarea class="plain" id="ref-text" placeholder="可留空" hidden></textarea>
      </div>
      <div class="field wide">
        <span>处理</span>
        <div class="checks">
          <label class="check"><input type="checkbox" id="denoise">降噪（样本有明显杂音时用）</label>
          <label class="check"><input type="checkbox" id="no-norm">关闭音量归一化（音量更贴近样本）</label>
        </div>
      </div>
    </div>

    <div class="submit">
      <button type="button" class="primary" id="submit" disabled>开始复刻</button>
      <button type="button" class="ghost" id="query">查询状态</button>
      <span class="hint" id="submit-hint">先录音或上传一个文件，再填音色 ID。</span>
    </div>
  </section>

  <section class="card result" id="result" aria-live="polite" hidden>
    <h2>结果</h2>
    <div id="result-body"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let busy = false;                    // a clone / query request is in flight
const TARGET_RATE = 24000;           // what we upload: 24 kHz mono 16-bit wav
const MAX_SECS = 180;                // 24 kHz 16-bit is ~48 KB/s: stays under the 10 MB limit
const MAX_BYTES = 10 * 1024 * 1024;
const FORMATS = ["wav", "mp3", "ogg", "m4a", "aac", "pcm"];

const SCRIPTS = [
  "今天早上出门的时候，楼下的桂花开了，整条街都是香的。我顺手买了一杯热豆浆，边走边喝，觉得这一天应该会挺顺利的。",
  "我平时比较喜欢周末去爬山，不用走太远，找一条有树荫的小路就行。爬到半山腰坐下来吹吹风，什么都不想，很快就放松下来了。",
  "上周我试着自己做了一顿红烧肉。糖色炒得有点过，颜色深了一些，不过味道还不错，家里人都说下次还想吃。",
  "如果你问我最喜欢哪个季节，我会说秋天。天气不冷不热，傍晚的光特别好看，随便拍一张照片都像明信片一样。",
];
let scriptIndex = 0;
$("script").value = SCRIPTS[0];
$("next-script").onclick = () => { scriptIndex = (scriptIndex + 1) % SCRIPTS.length; $("script").value = SCRIPTS[scriptIndex]; };

/* ---------- tabs ---------- */
let mode = "record";
function selectTab(next) {
  mode = next;
  for (const [tab, pane, m] of [["tab-record", "pane-record", "record"], ["tab-upload", "pane-upload", "upload"]]) {
    $(tab).setAttribute("aria-selected", String(m === next));
    $(pane).hidden = m !== next;
  }
  $("use-script-wrap").hidden = next !== "record";
  syncRefText();
  updateSubmit();
}
$("tab-record").onclick = () => selectTab("record");
$("tab-upload").onclick = () => selectTab("upload");

/* ---------- recorder ---------- */
const TAP = `class Tap extends AudioWorkletProcessor {
  process(inputs) { const ch = inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; }
}
registerProcessor("tap", Tap);`;

let ctx = null, stream = null, recState = "idle", chunks = [], recorded = 0, levels = [], recordedBlob = null;

function fmt(secs) { const m = Math.floor(secs / 60), s = secs - m * 60; return `${m}:${s.toFixed(1).padStart(4, "0")}`; }

function showLength(secs) {
  $("clock").textContent = fmt(secs);
  $("length-fill").style.width = `${Math.min(100, secs / 60 * 100)}%`;
  const note = $("length-note");
  if (secs === 0) { note.textContent = ""; note.dataset.tone = ""; }
  else if (secs < 10) { note.textContent = `再录 ${Math.ceil(10 - secs)} 秒就够用了`; note.dataset.tone = "warn"; }
  else if (secs <= 30) { note.textContent = "长度合适，可以点完成"; note.dataset.tone = "good"; }
  else { note.textContent = "已经够长了，再长对效果帮助不大"; note.dataset.tone = "good"; }
}

async function startRecording() {
  try {
    // raw voice: browser processing would change the timbre being cloned
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (err) {
    $("rec-label").textContent = `拿不到麦克风（${err.name}），在地址栏左侧允许后再试`;
    return;
  }
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([TAP], { type: "text/javascript" })));
  const tap = new AudioWorkletNode(ctx, "tap");
  const mute = ctx.createGain(); mute.gain.value = 0;
  ctx.createMediaStreamSource(stream).connect(tap).connect(mute).connect(ctx.destination);
  tap.port.onmessage = (e) => {
    if (recState !== "recording") return;
    const block = e.data;
    chunks.push(block);
    recorded += block.length;
    let sum = 0; for (const x of block) sum += x * x;
    levels.push(Math.min(1, Math.sqrt(sum / block.length) * 5));
    const secs = recorded / ctx.sampleRate;
    showLength(secs);
    if (secs >= MAX_SECS) finishRecording();
  };
  setRecState("recording");
}

function setRecState(state) {
  recState = state;
  const btn = $("rec");
  btn.dataset.state = state;
  btn.setAttribute("aria-label", { idle: "开始录音", recording: "暂停", paused: "继续录音", done: "重新开始录音" }[state]);
  $("rec-label").textContent = { idle: "点红点开始录音", recording: "录音中，点方块暂停", paused: "已暂停，点一下继续", done: "录好了，可以试听" }[state];
  $("finish").disabled = !(state === "recording" || state === "paused") || recorded === 0;
  $("redo").disabled = state === "idle";
}

$("rec").onclick = async () => {
  if (recState === "idle") await startRecording();
  else if (recState === "recording") setRecState("paused");
  else if (recState === "paused") setRecState("recording");
  else if (recState === "done") { resetRecording(); await startRecording(); }
};
$("finish").onclick = () => finishRecording();
$("redo").onclick = () => resetRecording();

function stopInput() {
  stream?.getTracks().forEach((t) => t.stop()); stream = null;
}

async function finishRecording() {
  if (!ctx || recorded === 0) return;
  const rate = ctx.sampleRate;
  setRecState("done");
  stopInput();
  const pcm = new Float32Array(recorded);
  let offset = 0;
  for (const c of chunks) { pcm.set(c, offset); offset += c.length; }
  await ctx.close(); ctx = null;
  recordedBlob = encodeWav(await resample(pcm, rate, TARGET_RATE), TARGET_RATE);
  const preview = $("rec-preview");
  preview.src = URL.createObjectURL(recordedBlob);
  preview.hidden = false;
  updateSubmit();
}

function resetRecording() {
  stopInput();
  ctx?.close(); ctx = null;
  chunks = []; recorded = 0; levels = []; recordedBlob = null;
  $("rec-preview").hidden = true; $("rec-preview").removeAttribute("src");
  showLength(0);
  setRecState("idle");
  updateSubmit();
}

async function resample(samples, from, to) {
  if (from === to) return samples;
  const offline = new OfflineAudioContext(1, Math.ceil(samples.length * to / from), to);
  const buffer = offline.createBuffer(1, samples.length, from);
  buffer.copyToChannel(samples, 0);
  const src = offline.createBufferSource();
  src.buffer = buffer; src.connect(offline.destination); src.start();
  return (await offline.startRendering()).getChannelData(0);
}

function encodeWav(samples, rate) {
  const view = new DataView(new ArrayBuffer(44 + samples.length * 2));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE");
  str(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  str(36, "data"); view.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([view], { type: "audio/wav" });
}

function drawLevels() {
  const canvas = $("level");
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue(recState === "paused" ? "--amber" : "--ink");
  const bars = Math.floor(w / 3), shown = levels.slice(-bars);
  shown.forEach((v, i) => { const bh = Math.max(1, v * h); g.fillRect(w - (shown.length - i) * 3, (h - bh) / 2, 2, bh); });
  requestAnimationFrame(drawLevels);
}
requestAnimationFrame(drawLevels);

/* ---------- upload ---------- */
let uploadFile = null;
const drop = $("drop");
drop.onclick = () => $("file").click();
drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } };
drop.ondragover = (e) => { e.preventDefault(); drop.dataset.over = "true"; };
drop.ondragleave = () => { drop.dataset.over = "false"; };
drop.ondrop = (e) => { e.preventDefault(); drop.dataset.over = "false"; if (e.dataTransfer.files[0]) pickFile(e.dataTransfer.files[0]); };
$("file").onchange = (e) => { if (e.target.files[0]) pickFile(e.target.files[0]); };

async function pickFile(file) {
  const ext = file.name.split(".").pop().toLowerCase();
  const info = $("file-info");
  uploadFile = null;
  $("file-preview").hidden = true;
  if (!FORMATS.includes(ext)) { info.innerHTML = ""; info.append(errorText(`不支持 .${ext}，请用 ${FORMATS.join(" / ")}`)); updateSubmit(); return; }
  if (file.size > MAX_BYTES) { info.innerHTML = ""; info.append(errorText(`文件 ${(file.size / 1048576).toFixed(1)}MB，超过 10MB 上限`)); updateSubmit(); return; }
  uploadFile = file;
  info.textContent = `${file.name} · ${(file.size / 1024).toFixed(0)} KB`;
  if (ext !== "pcm") {
    const preview = $("file-preview");
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    preview.onloadedmetadata = () => { if (isFinite(preview.duration)) info.textContent += ` · ${preview.duration.toFixed(1)} 秒`; };
  }
  updateSubmit();
}

/* ---------- voice settings ---------- */
const kindLabels = {
  speaker_id: ["音色 ID", "控制台「声音复刻」里的 S_ 编号", "S_xxxxxxxx"],
  custom_speaker_id: ["自定义音色名", "8 位以上字母数字，字母开头；首次合成时收槽位费", "myVoice01"],
};
function kind() { return document.querySelector('input[name="kind"]:checked').value; }
for (const radio of document.querySelectorAll('input[name="kind"]')) {
  radio.onchange = () => {
    const [title, help, placeholder] = kindLabels[kind()];
    $("id-label").innerHTML = "";
    $("id-label").append(title, " ", Object.assign(document.createElement("small"), { textContent: help }));
    $("voice-id").placeholder = placeholder;
    $("voice-id").value = localStorage.getItem(`voice-clone:${kind()}`) || "";
    updateSubmit();
  };
}
$("voice-id").value = localStorage.getItem("voice-clone:speaker_id") || "";
$("voice-id").oninput = updateSubmit;

function syncRefText() { $("ref-text").hidden = mode === "record" && $("use-script").checked; }
$("use-script").onchange = syncRefText;

function sample() { return mode === "record" ? recordedBlob && { blob: recordedBlob, name: "recording.wav" } : uploadFile && { blob: uploadFile, name: uploadFile.name }; }

function updateSubmit() {
  const id = $("voice-id").value.trim();
  const ready = sample() && id;
  $("submit").disabled = !ready || busy;
  $("query").disabled = !id || busy;
  $("submit-hint").textContent = busy ? "" : !sample() ? (mode === "record" ? "先录一段，点完成。" : "先选一个音频文件。") : !id ? "再填上音色 ID。" : "准备好了。训练一般要几十秒。";
}

/* ---------- submit / query ---------- */
function errorText(text) { return Object.assign(document.createElement("div"), { className: "error", textContent: text }); }

function describeError(detail) {
  if (detail && typeof detail === "object") return `${detail.message || "失败"}${detail.logid ? `\nlogid：${detail.logid}` : ""}`;
  return String(detail || "失败");
}

const STATUS = {
  SUCCESS: ["训练完成，可以合成", "good"], ACTIVE: ["已启用，可以合成", "good"],
  TRAINING: ["训练中", "busy"], FAILED: ["训练失败", "bad"], NOT_FOUND: ["还没有训练过", ""],
};

function showResult(data) {
  const body = $("result-body");
  body.innerHTML = "";
  const [label, tone] = STATUS[data.status] || [data.status, ""];
  const dl = document.createElement("dl");
  const add = (k, v) => { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.append(v); dl.append(dt, dd); };
  const badge = Object.assign(document.createElement("span"), { className: "badge", textContent: label });
  badge.dataset.tone = tone;
  add("状态", badge);
  add("音色 ID", data.speaker_id || "—");
  add("剩余训练次数", data.available_training_times ?? "—");
  if (data.demo_audio) {
    const audio = Object.assign(document.createElement("audio"), { controls: true, src: data.demo_audio });
    const wrap = document.createElement("div"); wrap.append(audio);
    wrap.append(Object.assign(document.createElement("div"), { className: "hint", textContent: "试听链接一小时内有效，满意了再拿去合成。" }));
    add("试听", wrap);
  }
  body.append(dl);
  $("result").hidden = false;
}

function showError(text) {
  $("result-body").innerHTML = "";
  $("result-body").append(errorText(text));
  $("result").hidden = false;
}

function setBusy(on, text = "") {
  busy = on;
  updateSubmit();
  $("submit-hint").textContent = text;
}

$("submit").onclick = async () => {
  const s = sample(), id = $("voice-id").value.trim();
  if (!s || !id) return;
  localStorage.setItem(`voice-clone:${kind()}`, id);
  const form = new FormData();
  form.append("file", s.blob, s.name);
  form.append(kind(), id);
  form.append("language", $("language").value);
  const demo = $("demo-text").value.trim();
  if (demo) form.append("demo_text", demo);
  const ref = mode === "record" && $("use-script").checked ? $("script").value.trim() : $("ref-text").value.trim();
  if (ref) form.append("text", ref);
  form.append("denoise", $("denoise").checked);
  form.append("disable_volume_normalization", $("no-norm").checked);
  form.append("wait", "true");

  const started = performance.now();
  setBusy(true, "上传中…");
  const tick = setInterval(() => { $("submit-hint").textContent = `训练中… ${Math.floor((performance.now() - started) / 1000)} 秒`; }, 1000);
  try {
    const res = await fetch(location.pathname.replace(/\/$/, ""), { method: "POST", body: form });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) showError(describeError(data.detail));
    else showResult(data);
  } catch (err) {
    showError(`请求失败：${err.message}`);
  } finally {
    clearInterval(tick);
    setBusy(false);
  }
};

$("query").onclick = async () => {
  const id = $("voice-id").value.trim();
  if (!id) return;
  setBusy(true, "查询中…");
  try {
    const res = await fetch(`${location.pathname.replace(/\/$/, "")}/status?${new URLSearchParams({ [kind()]: id })}`);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) showError(describeError(data.detail));
    else showResult(data);
  } catch (err) {
    showError(`请求失败：${err.message}`);
  } finally {
    setBusy(false);
  }
};

showLength(0);
setRecState("idle");
updateSubmit();
</script>
</body>
</html>
